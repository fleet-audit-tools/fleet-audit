<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fleet Audit">
<meta name="theme-color" content="#1B2B53">
<title>Fleet Appearance Audit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%231B2B53%27/%3E%3Crect x=%2712%27 y=%2745%27 width=%2740%27 height=%275%27 fill=%27%23C8102E%27/%3E%3Cpath d=%27M12 22h26l10 8v8H12z%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --navy:#1B2B53; --navy-2:#2A3F75; --red:#C8102E; --green:#1E7F4F; --amber:#B45309;
  --paper:#F3F4F6; --surface:#FFFFFF; --ink:#111827; --muted:#6B7280; --line:#D1D5DB; --line-2:#E5E7EB;
  --topbar-h:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#0F1522; --surface:#1A2233; --ink:#E8ECF4; --muted:#9AA3B5; --line:#33405A; --line-2:#26314A; }
}
:root[data-theme="dark"]{ --paper:#0F1522; --surface:#1A2233; --ink:#E8ECF4; --muted:#9AA3B5; --line:#33405A; --line-2:#26314A; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer}
a{color:var(--navy)}

.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:4px solid var(--red);min-height:var(--topbar-h);padding:0 12px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:8px}
.topbar h1{font-size:17px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.1px}
.topbar .sub{font-weight:400;opacity:.75;font-size:14px}
.topbar button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:8px;padding:7px 11px;font-weight:600;min-height:36px}
.topbar button.plain{background:transparent;border-color:transparent;padding-left:4px;padding-right:8px}

.screen{max-width:760px;margin:0 auto;padding:12px 14px 60px}
.btn{appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:9px 14px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink);text-decoration:none}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red);background:var(--surface)}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btnrow .btn{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
p{margin:6px 0}

.progress{display:flex;align-items:center;gap:10px;margin:8px 0 6px;font-size:14px}
.progress .bar{flex:1;height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--green);border-radius:3px}

.row{appearance:none;-webkit-appearance:none;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;border-radius:0}
.row .num{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.row .route{font-size:14px;color:var(--muted)}
.row .dmg{font-size:13px;color:var(--red);margin-top:2px}
.row .st{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:inline-block;flex:none}
.dot.started{border-color:var(--amber);background:linear-gradient(90deg,var(--amber) 50%,transparent 50%)}
.dot.done{border-color:var(--green);background:var(--green)}
.chev{color:var(--muted);font-size:20px;line-height:1}
.empty{padding:26px 8px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:18px;margin:0 0 6px;font-weight:600}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted);margin:12px 0}

.sec{padding:14px 0 12px;border-bottom:1px solid var(--line)}
.sec h2{font-size:15px;font-weight:600;margin:0 0 8px}
.sec h2 span{font-weight:400;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .wide{grid-column:1/-1}
.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:44px}
.f textarea{min-height:96px;resize:vertical}
.f input::placeholder,.f textarea::placeholder{color:var(--muted);opacity:.8}
.pf{color:var(--ink)}

.palette{position:sticky;top:calc(var(--topbar-h) + env(safe-area-inset-top));z-index:10;background:var(--paper);padding:8px 0 10px;display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.code{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0 4px;text-align:center;line-height:1.1;min-height:48px}
.code b{display:block;font-size:15px}
.code small{display:block;font-size:10px;color:var(--muted)}
.code.on{background:var(--red);border-color:var(--red);color:#fff}
.code.on small{color:rgba(255,255,255,.85)}
.hint{font-size:13px;color:var(--muted);margin:0 0 8px}

.view{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 6px 2px;margin-bottom:10px}
.view svg{width:100%;height:auto;display:block;touch-action:manipulation;cursor:crosshair}
.view .cap{font-size:13px;color:var(--muted);padding:3px 4px 4px;display:flex;justify-content:space-between}
.views2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.ph{position:relative;aspect-ratio:4/3;background:#111;border-radius:8px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph select{position:absolute;left:4px;right:4px;bottom:4px;font-size:12px;padding:4px 6px;border-radius:6px;border:0;background:rgba(255,255,255,.92);color:#111;min-height:28px}
.ph .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1}
.filein{display:none}

.bottombar{position:sticky;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.bottombar .btn{flex:1}
.bottombar .btn.done{background:var(--green);border-color:var(--green);color:#fff}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media (min-width:600px){.modal{align-items:center;padding:16px}}
.modal .box{background:var(--surface);border-radius:14px 14px 0 0;max-width:720px;width:100%;max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:600px){.modal .box{border-radius:14px}}
.modal h2{font-size:18px;margin:0 0 10px;font-weight:600}
.modal .preview{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.stack{display:flex;flex-direction:column;gap:8px}
.kv{font-size:14px;color:var(--muted);margin:8px 0}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;z-index:60;display:flex;gap:14px;align-items:center;max-width:92vw;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.toast button{background:transparent;border:0;color:#7CC4FF;font-weight:700;padding:0}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px}
.busy .in{max-width:340px}
.busy .bar{height:8px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;margin-top:12px}
.busy .bar i{display:block;height:100%;background:#fff;width:0}
.warn{background:#FEF3C7;color:#78350F;border:1px solid #F59E0B;border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
:focus-visible{outline:3px solid #7CC4FF;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

 (function next(){if(i>=files.length){busy(false);scheduleSave();renderPhotos(t);var pc=$('#ph-count');if(pc)pc.textContent=photoCountText(t);return;}var f=files[i++];processImage(f).then(function(r){var id=uid();return sSet('photo:'+id,r.blob).then(function(){t.photos.push({id:id,label:nextLabel(t),thumb:r.thumb,w:r.w,h:r.h});busy('Adding photos\u2026',i/files.length);next();});}).catch(function(err){busy(false);toast('Could not add that photo: '+(err.message||err));next();});})();}
function renderPhotos(t){var g=$('#photos');if(!g)return;g.innerHTML=t.photos.map(function(p,i){return '<div class="ph" data-i="'+i+'"><img src="'+p.thumb+'" alt=""><button type="button" class="x" aria-label="Remove photo">\u00D7</button><select aria-label="Photo label">'+LABELS.map(function(l){return '<option'+(p.label===l?' selected':'')+'>'+l+'</option>';}).join('')+'</select></div>';}).join('');
 $$('.ph',g).forEach(function(el){var i=+el.getAttribute('data-i');$('select',el).onchange=function(e){t.photos[i].label=e.target.value;scheduleSave();};$('.x',el).onclick=function(){var p=t.photos.splice(i,1)[0];sDel('photo:'+p.id);scheduleSave();renderPhotos(t);var pc=$('#ph-count');if(pc)pc.textContent=photoCountText(t);};});}

// --- export rendering ---
function svgToCanvas(svgStr,w,h,scale){return loadImage('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgStr)).then(function(img){var c=document.createElement('canvas');c.width=Math.round(w*scale);c.height=Math.round(h*scale);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c;});}
function renderFormCanvas(t){return svgToCanvas(formSVG(t,state.meta),1000,1390,1.2);}
function blobToDataURL(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.readAsDataURL(b);});}
function loadPhotosForExport(t){var out=[];var chain=Promise.resolve();t.photos.forEach(function(p){chain=chain.then(function(){return sGet('photo:'+p.id);}).then(function(b){if(!b)return;return blobToDataURL(b).then(function(d){out.push({data:d.replace(/^data:/,''),dataUrl:d,w:p.w,h:p.h,label:p.label});});});});return chain.then(function(){return out;});}
var PX=192; // px per inch on the 1920x1080 slide canvas
function canvasHeader(x,t,L,nDetail,nExtra,suffix,F){var c=suffix?L.capWide:L.cap,lw=suffix?4.6:2.3;x.textBaseline='middle';x.textAlign='left';x.fillStyle=NAVY;x.font='bold 35px '+F;x.fillText(captionLeft(t,suffix),c.x*PX,(c.y+c.h/2)*PX);var right=suffix?[state.meta.location,longDate(t.date||state.meta.date)].filter(Boolean).join('  \u00B7  '):truckSubtitle(t,state.meta,nDetail,nExtra);if(right){x.fillStyle=MUTED;x.font='23px '+F;x.textAlign='right';x.fillText(right,(c.x+c.w)*PX,(c.y+c.h/2)*PX);x.textAlign='left';}}
function drawSlotPlaceholder(x,box,name,F){x.fillStyle='#F3F4F6';x.fillRect(box.x*PX,box.y*PX,box.w*PX,box.h*PX);x.strokeStyle='#D1D5DB';x.lineWidth=2;x.strokeRect(box.x*PX,box.y*PX,box.w*PX,box.h*PX);x.fillStyle=MUTED;x.font='20px '+F;x.textAlign='center';x.fillText(name,(box.x+box.w/2)*PX,(box.y+box.h/2-0.08)*PX);x.fillText('no photo',(box.x+box.w/2)*PX,(box.y+box.h/2+0.08)*PX);x.textAlign='left';}
function drawPhotoInBox(x,box,img){var f=photoFit(box,img.width,img.height);if(f.mode==='cover')x.drawImage(img,f.sx,f.sy,f.sw,f.sh,box.x*PX,box.y*PX,box.w*PX,box.h*PX);else x.drawImage(img,f.box.x*PX,f.box.y*PX,f.box.w*PX,f.box.h*PX);}
function slideCanvas(t,formCanvas,photos){var c=document.createElement('canvas');c.width=1920;c.height=1080;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1920,1080);var L=slideLayout();var P=placePhotos(photos);var F='Helvetica, Arial, sans-serif';canvasHeader(x,t,L,P.detail.length,P.extra.length,'',F);
 var fb=fitBox(L.form,formCanvas.width,formCanvas.height);x.drawImage(formCanvas,fb.x*PX,fb.y*PX,fb.w*PX,fb.h*PX);x.strokeStyle='#E5E7EB';x.lineWidth=2;x.strokeRect(fb.x*PX,fb.y*PX,fb.w*PX,fb.h*PX);
 SLOTS.forEach(function(name){var box=L.slots[name],p=P.slots[name];if(p)drawPhotoInBox(x,box,p.img);else drawSlotPlaceholder(x,box,name,F);});
 return c;}
function detailCanvas(t,list,suffix){var c=document.createElement('canvas');c.width=1920;c.height=1080;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1920,1080);var L=slideLayout();var F='Helvetica, Arial, sans-serif';canvasHeader(x,t,L,0,0,suffix,F);var G=gridBoxes(L,list.length);list.forEach(function(p,i){var box=G[i];if(!box)return;var f=fitBox(box,p.img.width,p.img.height);x.drawImage(p.img,f.x*PX,f.y*PX,f.w*PX,f.h*PX);});return c;}
function fleetCanvas(trucks,meta,page,pages){var c=document.createElement('canvas');c.width=1920;c.height=1080;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1920,1080);var F='Helvetica, Arial, sans-serif';x.textBaseline='middle';
 x.fillStyle=NAVY;x.font='bold 44px '+F;x.fillText('Fleet list'+(pages>1?' ('+(page+1)+' of '+pages+')':''),0.35*PX,0.405*PX);
 x.fillStyle=MUTED;x.font='22px '+F;x.textAlign='right';x.fillText([meta.location?meta.location+' fleet appearance audit':'Fleet appearance audit',longDate(meta.date)].filter(Boolean).join('   |   '),9.65*PX,0.405*PX);x.textAlign='left';x.fillText(fleetSummary(trucks),0.35*PX,0.745*PX);
 var per=fleetPer(trucks.length),blocks=2,perSlide=per*blocks,colW=[0.9,1.05,0.8,1.8],rowH=0.21;
 for(var b=0;b<blocks;b++){var rows=trucks.slice(page*perSlide+b*per,page*perSlide+(b+1)*per);if(!rows.length)break;var bx=0.35+b*4.75,by=0.95;
  var hx=bx;x.fillStyle=NAVY;x.fillRect(bx*PX,by*PX,4.55*PX,rowH*PX);x.fillStyle='#fff';x.font='bold 18px '+F;['Truck #','Route','Audit','Damage noted'].forEach(function(hh,i){x.fillText(hh,(hx+0.05)*PX,(by+rowH/2)*PX);hx+=colW[i];});
  rows.forEach(function(t,ri){var y=by+(ri+1)*rowH;var cx=bx;x.strokeStyle='#D1D5DB';x.lineWidth=1;x.strokeRect(bx*PX,y*PX,4.55*PX,rowH*PX);var vals=[t.truck,routeLabel(t.route),t.done?'Complete':(hasData(t)?'Started':''),damageSummary(t)];vals.forEach(function(v,i){x.fillStyle=(i===3&&v)?RED:'#111827';x.font=(i===0?'bold ':'')+'18px '+F;x.fillText(v||'',(cx+0.05)*PX,(y+rowH/2)*PX);cx+=colW[i];});});
  var gx=bx;colW.forEach(function(w){gx+=w;if(gx<bx+4.55){x.strokeStyle='#D1D5DB';x.beginPath();x.moveTo(gx*PX,by*PX);x.lineTo(gx*PX,(by+(rows.length+1)*rowH)*PX);x.stroke();}});}
 return c;}
function canvasJPEG(c,q){return c.toDataURL('image/jpeg',q||0.85);}
function dataURLtoBlob(d){var p=d.split(',');var bin=atob(p[1]);var u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:p[0].split(':')[1].split(';')[0]});}
function safeName(s){return String(s||'').replace(/[^A-Za-z0-9._-]+/g,'-').replace(/^-+|-+$/g,'')||'fleet';}
function fileBase(){return 'Fleet-audit-'+(state.meta.location?safeName(state.meta.location)+'-':'')+(state.meta.date||todayISO());}

function previewTruck(t){saveNow();busy('Rendering preview\u2026',0.2);renderFormCanvas(t).then(function(fc){return loadPhotosForExport(t).then(function(ps){var chain=Promise.resolve();ps.forEach(function(p){chain=chain.then(function(){return loadImage(p.dataUrl).then(function(img){p.img=img;});});});return chain.then(function(){return slideCanvas(t,fc,ps);});});}).then(function(c){busy(false);var d=canvasJPEG(c,0.85);var m=modal('<h2>Slide preview</h2><img class="preview" src="'+d+'" alt="Slide preview for truck '+esc(t.truck)+'"><div class="btnrow"><button class="btn" data-a="close">Close</button><button class="btn primary" data-a="save">Save as JPEG</button></div>');$('[data-a=close]',m).onclick=closeModal;$('[data-a=save]',m).onclick=function(){deliverFile(dataURLtoBlob(d),'Truck-'+safeName(t.truck)+'-audit.jpg');};}).catch(function(e){busy(false);toast('Preview failed: '+(e.message||e));});}

// --- export flows ---
function openExport(){if(!state.trucks.length){toast('Add trucks first');return;}var m=modal('<h2>Export</h2><p class="muted small">Slide 1 is the fleet list, then one slide per truck in list order, laid out like the template. Damage close-ups, and any extra photos, follow that truck on their own slides. '+esc(fleetSummary(state.trucks))+'.</p><div class="stack"><button class="btn primary" data-a="pptx">PowerPoint deck (.pptx)</button><button class="btn" data-a="pdf">PDF of every slide</button><button class="btn" data-a="json">Backup file (.json)</button></div><p class="muted small" style="margin-top:12px">The deck opens in PowerPoint on the phone or laptop and can be shared to Teams or OneDrive from the save sheet.</p>');
 $('[data-a=pptx]',m).onclick=function(){closeModal();exportDeck();};$('[data-a=pdf]',m).onclick=function(){closeModal();exportPDF();};$('[data-a=json]',m).onclick=function(){closeModal();exportBackup();};}
function readyModal(blob,filename,what){var mb=(blob.size/1048576).toFixed(1);var m=modal('<h2>'+esc(what)+' ready</h2><p class="muted">'+esc(filename)+' ('+mb+' MB)</p><div class="btnrow"><button class="btn" data-a="close">Close</button><button class="btn primary" data-a="save">Save</button></div>');$('[data-a=close]',m).onclick=closeModal;$('[data-a=save]',m).onclick=function(){deliverFile(blob,filename);};}
function exportDeck(){saveNow();if(typeof PptxGenJS==='undefined'){toast('PowerPoint library did not load');return;}var T=state.trucks;busy('Building the deck\u2026',0);var pptx=new PptxGenJS();pptx.layout='LAYOUT_16x9';pptx.title='Fleet appearance audit';pptx.author='Fleet audit';addFleetSlides(pptx,T,state.meta);var i=0;
 (function next(){if(i>=T.length){busy('Writing the file\u2026',0.98);return pptx.write({outputType:'blob'}).then(function(blob){busy(false);readyModal(blob,fileBase()+'.pptx','PowerPoint deck');}).catch(function(e){busy(false);toast('Deck failed: '+(e.message||e));});}var t=T[i++];busy('Building the deck\u2026 truck '+i+' of '+T.length,i/(T.length+1));renderFormCanvas(t).then(function(fc){var fd=canvasJPEG(fc,0.8);return loadPhotosForExport(t).then(function(ps){addTruckSlide(pptx,t,state.meta,{data:fd.replace(/^data:/,''),w:fc.width,h:fc.height},ps);setTimeout(next,0);});}).catch(function(e){busy(false);toast('Deck failed on truck '+t.truck+': '+(e.message||e));});})();}
function exportPDF(){saveNow();if(!(window.jspdf&&window.jspdf.jsPDF)){toast('PDF library did not load');return;}var T=state.trucks;busy('Building the PDF\u2026',0);var doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'in',format:[10,5.625]});var pages=Math.max(1,Math.ceil(T.length/40));for(var p=0;p<pages;p++){if(p>0)doc.addPage([10,5.625],'landscape');doc.addImage(canvasJPEG(fleetCanvas(T,state.meta,p,pages),0.85),'JPEG',0,0,10,5.625,undefined,'FAST');}var i=0;
 (function next(){if(i>=T.length){busy(false);readyModal(doc.output('blob'),fileBase()+'.pdf','PDF');return;}var t=T[i++];busy('Building the PDF\u2026 truck '+i+' of '+T.length,i/T.length);renderFormCanvas(t).then(function(fc){return loadPhotosForExport(t).then(function(ps){var chain=Promise.resolve();ps.forEach(function(p){chain=chain.then(function(){return loadImage(p.dataUrl).then(function(img){p.img=img;});});});return chain.then(function(){doc.addPage([10,5.625],'landscape');doc.addImage(canvasJPEG(slideCanvas(t,fc,ps),0.85),'JPEG',0,0,10,5.625,undefined,'FAST');var P=placePhotos(ps);[['damage close-ups',P.detail],['additional photos',P.extra]].forEach(function(g){if(g[1].length){doc.addPage([10,5.625],'landscape');doc.addImage(canvasJPEG(detailCanvas(t,g[1],g[0]),0.85),'JPEG',0,0,10,5.625,undefined,'FAST');}});setTimeout(next,0);});});}).catch(function(e){busy(false);toast('PDF failed on truck '+t.truck+': '+(e.message||e));});})();}
function exportBackup(){saveNow();busy('Packing backup\u2026',0.3);var copy=JSON.parse(JSON.stringify(state));var chain=Promise.resolve();copy.trucks.forEach(function(t){t.photos.forEach(function(p){chain=chain.then(function(){return sGet('photo:'+p.id);}).then(function(b){if(b)return blobToDataURL(b).then(function(d){p.data=d;});});});});chain.then(function(){busy(false);var blob=new Blob([JSON.stringify(copy)],{type:'application/json'});readyModal(blob,fileBase()+'-backup.json','Backup');}).catch(function(e){busy(false);toast('Backup failed: '+(e.message||e));});}
function importBackup(file){var r=new FileReader();r.onload=function(){try{var data=JSON.parse(r.result);if(!data||!Array.isArray(data.trucks))throw new Error('Not a fleet audit backup');busy('Restoring\u2026',0.2);var chain=Promise.resolve();data.trucks.forEach(function(t){t.photos=(t.photos||[]);t.photos.forEach(function(p){if(p.data){var d=p.data;delete p.data;chain=chain.then(function(){return sSet('photo:'+p.id,dataURLtoBlob(d));});}});});chain.then(function(){data.ui={screen:'fleet',truckId:null,code:'S'};state=data;busy(false);return saveNow();}).then(function(){closeModal();render();toast('Backup restored');});}catch(e){busy(false);toast('Could not restore: '+e.message);}};r.readAsText(file);}
function deliverFile(blob,filename){if(DL){return DL.save({filename:filename,data:blob}).then(function(){toast('Saved');closeModal();}).catch(function(e){var code=e&&e.code;if(code==='declined')return;if(code==='unavailable'||code==='not_granted'||code==='capability_disabled'||code==='capability_removed'){DL=null;return deliverFile(blob,filename);}toast('Could not save: '+((e&&(e.message||e.code))||'unknown error'));});}
 try{var file=new File([blob],filename,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){return navigator.share({files:[file],title:filename}).then(function(){closeModal();}).catch(function(e){if(e&&e.name==='AbortError')return;anchorDownload(blob,filename);});}}catch(e){}
 anchorDownload(blob,filename);return Promise.resolve();}
function anchorDownload(blob,filename){var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},6000);closeModal();toast('Download started');}

// --- fleet list editing, settings ---
function openPaste(){var m=modal('<h2>Paste fleet list</h2><p class="muted small">One truck per line: truck number, then the route. Tabs, commas or spaces are fine, and a two-column table pasted from Excel works too. Existing trucks keep their audit data.</p><div class="f"><textarea id="paste-box" placeholder="225474  21&#10;225577  61&#10;158790  spare" style="min-height:160px"></textarea></div><div class="btnrow"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="go">Add trucks</button></div>');$('[data-a=close]',m).onclick=closeModal;$('[data-a=go]',m).onclick=function(){var rows=parseFleetList($('#paste-box').value);var added=0,updated=0;rows.forEach(function(r){if(!r.truck)return;var ex=state.trucks.filter(function(t){return t.truck===r.truck;})[0];if(ex){if(r.route&&ex.route!==r.route){ex.route=r.route;updated++;}}else{state.trucks.push(newTruck(r.truck,r.route));added++;}});saveNow();closeModal();renderFleet();toast((added?added+' added':'No new trucks')+(updated?', '+updated+' routes updated':''));};setTimeout(function(){var pb=$('#paste-box');if(pb)pb.focus();},50);}
function openAddTruck(){var m=modal('<h2>Add truck</h2><div class="fields"><div class="f"><label for="a-truck">Truck number</label><input id="a-truck" type="text" inputmode="numeric"></div><div class="f"><label for="a-route">Route</label><input id="a-route" type="text" placeholder="21, spare, install\u2026"></div></div><div class="btnrow"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="go">Add</button></div>');$('[data-a=close]',m).onclick=closeModal;$('[data-a=go]',m).onclick=function(){var n=$('#a-truck').value.trim();if(!n){toast('Truck number is required');return;}if(state.trucks.some(function(t){return t.truck===n;})){toast('Truck '+n+' is already on the list');return;}var t=newTruck(n,$('#a-route').value);state.trucks.push(t);saveNow();closeModal();openTruck(t.id);};setTimeout(function(){var at=$('#a-truck');if(at)at.focus();},50);}
function openSettings(){var me=state.meta;var m=modal('<h2>Audit settings</h2><div class="fields"><div class="f wide"><label for="s-loc">Location</label><input id="s-loc" type="text" value="'+esc(me.location)+'" placeholder="Branch or location name"></div><div class="f"><label for="s-date">Audit date</label><input id="s-date" type="date" value="'+esc(me.date)+'"></div><div class="f"><label for="s-body">Default body type</label><select id="s-body">'+Object.keys(BODIES).map(function(k){return '<option value="'+k+'"'+(me.body===k?' selected':'')+'>'+BODIES[k]+'</option>';}).join('')+'</select></div><div class="f"><label for="s-aud">Service partner (default)</label><input id="s-aud" type="text" value="'+esc(me.auditor)+'"></div><div class="f"><label for="s-pp">Production partner (default)</label><input id="s-pp" type="text" value="'+esc(me.production)+'"></div></div><div class="btnrow"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="save">Save settings</button></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="stack"><button class="btn" data-a="restore">Restore from backup file</button><input class="filein" id="in-restore" type="file" accept="application/json,.json"><button class="btn danger" data-a="clear">Clear all data on this device</button></div><p class="muted small" style="margin-top:12px">Data stays on this phone only. Keep a backup or export the deck before switching devices. Fleet audit v'+APP_VERSION+'</p>');
 $('[data-a=close]',m).onclick=closeModal;$('[data-a=save]',m).onclick=function(){me.location=$('#s-loc').value.trim();me.date=$('#s-date').value||todayISO();me.body=$('#s-body').value;me.auditor=$('#s-aud').value.trim();me.production=$('#s-pp').value.trim();saveNow();closeModal();renderFleet();};
 $('[data-a=restore]',m).onclick=function(){$('#in-restore').click();};$('#in-restore').onchange=function(e){if(e.target.files[0])importBackup(e.target.files[0]);};
 $('[data-a=clear]',m).onclick=function(){confirmBox('Clear everything?','All trucks, marks, notes and photos on this device are deleted. Export first if you need them.','Clear all').then(function(ok){if(!ok)return;idb.clear().catch(function(){});memStore={};state=blankState();saveNow();render();toast('Cleared');});};}

// --- init ---
function init(){sGet('state').then(function(s){state=(s&&Array.isArray(s.trucks))?s:blankState();if(!state.meta)state.meta={};if(!state.meta.date)state.meta.date=todayISO();if(!state.ui)state.ui={screen:'fleet',truckId:null,code:'S'};state.trucks.forEach(function(t){t.markers=t.markers||[];t.photos=t.photos||[];});render();}).catch(function(){state=blankState();render();});
 try{if(window.claude&&typeof window.claude.use==='function'){window.claude.use('downloads').then(function(ns){if(ns)DL=ns;}).catch(function(){});}}catch(e){}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
