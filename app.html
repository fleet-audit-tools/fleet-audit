<style>
:root{
  --navy:#1B2B53; --navy-2:#2A3F75; --red:#C8102E; --green:#1E7F4F; --amber:#B45309;
  --paper:#F3F4F6; --surface:#FFFFFF; --ink:#111827; --muted:#6B7280; --line:#D1D5DB; --line-2:#E5E7EB;
  --topbar-h:56px;
}
:root{color-scheme:light}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer}
a{color:var(--navy)}

.topbar{position:sticky;top:0;z-index:20;background:#fff;color:var(--navy);border-bottom:4px solid var(--red);min-height:var(--topbar-h);padding:0 12px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:8px}
.topbar h1{font-size:17px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.1px}
.topbar .sub{font-weight:400;opacity:.7;font-size:14px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;padding:10px 12px 6px;padding-top:calc(10px + env(safe-area-inset-top))}
.brand .name{color:var(--navy);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.brand .name small{display:block;font-weight:500;letter-spacing:0;text-transform:none;font-size:13px;color:var(--muted);margin-top:2px}
.brand img{height:30px;width:auto;flex:none}
.topbar.after-brand{padding-top:0}
.topbar.after-brand h1{font-size:16px}
.topbar button{background:#fff;border:1px solid var(--navy);color:var(--navy);border-radius:8px;padding:7px 11px;font-weight:600;min-height:36px}
.topbar button.plain{background:transparent;border-color:transparent;padding-left:4px;padding-right:8px}

.screen{max-width:760px;margin:0 auto;padding:12px 14px 60px}
.btn,.row,.code,.topbar button,.tb-btn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.btn:active,.topbar button:active{transform:scale(.985);filter:brightness(.95)}
.code:active{transform:scale(.96)}
.row:active{background:var(--line-2)}
.btn,.code,.topbar button{transition:transform 60ms ease,filter 60ms ease}
.view svg,.view svg image,.brand img,.ph img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.row.last{box-shadow:inset 3px 0 0 var(--navy);background:#F5F7FB}
.btn{appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:9px 14px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink);text-decoration:none}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red);background:var(--surface)}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btnrow .btn{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
p{margin:6px 0}

.progress{display:flex;align-items:center;gap:10px;margin:8px 0 6px;font-size:14px}
.progress .bar{flex:1;height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--green);border-radius:3px}

.row{appearance:none;-webkit-appearance:none;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;border-radius:0}
.row .num{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.row .route{font-size:14px;color:var(--muted)}
.row .dmg{font-size:13px;color:var(--red);margin-top:2px}
.row .st{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:inline-block;flex:none}
.dot.started{border-color:var(--amber);background:linear-gradient(90deg,var(--amber) 50%,transparent 50%)}
.dot.done{border-color:var(--green);background:var(--green)}
.chev{color:var(--muted);font-size:20px;line-height:1}
.empty{padding:26px 8px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:18px;margin:0 0 6px;font-weight:600}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted);margin:12px 0}

.sec{padding:14px 0 12px;border-bottom:1px solid var(--line)}
.sec h2{font-size:15px;font-weight:600;margin:0 0 8px}
.sec h2 span{font-weight:400;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .wide{grid-column:1/-1}
.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:44px}
.f textarea{min-height:96px;resize:vertical}
.f input::placeholder,.f textarea::placeholder{color:var(--muted);opacity:.8}
.pf{color:var(--ink)}

.palette{position:sticky;top:calc(var(--topbar-h) + env(safe-area-inset-top));z-index:10;background:var(--paper);padding:8px 0 10px;display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.code{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0 4px;text-align:center;line-height:1.1;min-height:48px}
.code b{display:block;font-size:15px}
.code small{display:block;font-size:10px;color:var(--muted)}
.code.on{background:var(--red);border-color:var(--red);color:#fff}
.code.on small{color:rgba(255,255,255,.85)}
.hint{font-size:13px;color:var(--muted);margin:0 0 8px}

.view{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 6px 2px;margin-bottom:10px}
.view svg{width:100%;height:auto;display:block;touch-action:manipulation;cursor:crosshair}
.view .cap{font-size:13px;color:var(--muted);padding:3px 4px 4px;display:flex;justify-content:space-between}
.views2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.ph{position:relative;aspect-ratio:4/3;background:#111;border-radius:8px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph select{position:absolute;left:4px;right:4px;bottom:4px;font-size:12px;padding:4px 6px;border-radius:6px;border:0;background:rgba(255,255,255,.92);color:#111;min-height:28px}
.ph .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1}
.filein{display:none}

.bottombar{position:sticky;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.bottombar .btn{flex:1}
.bottombar .btn.done{background:var(--green);border-color:var(--green);color:#fff}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media (min-width:600px){.modal{align-items:center;padding:16px}}
.modal .box{background:var(--surface);border-radius:14px 14px 0 0;max-width:720px;width:100%;max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:600px){.modal .box{border-radius:14px}}
.modal h2{font-size:18px;margin:0 0 10px;font-weight:600}
.modal .preview{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.stack{display:flex;flex-direction:column;gap:8px}
.kv{font-size:14px;color:var(--muted);margin:8px 0}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;z-index:60;display:flex;gap:14px;align-items:center;max-width:92vw;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.toast button{background:transparent;border:0;color:#7CC4FF;font-weight:700;padding:0}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px}
.busy .in{max-width:340px}
.busy .bar{height:8px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;margin-top:12px}
.busy .bar i{display:block;height:100%;background:#fff;width:0}
.warn{background:#FEF3C7;color:#78350F;border:1px solid #F59E0B;border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
:focus-visible{outline:3px solid #7CC4FF;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function vbFor(body,view){var im=imgFor(body,view);return [im.w,im.h];}
function markerR(body,view){var im=imgFor(body,view);return viewKind(view)==='side'?im.w*0.035:im.h*0.06;}
var SLOTS=['Front','Back','Interior','Driver side','Passenger side'];var MAX_DETAIL=4;var MAX_EXTRA=4;var MAX_PHOTOS=SLOTS.length+MAX_DETAIL+MAX_EXTRA;var LABELS=SLOTS.concat(['Damage detail','Other']);var INK='#1F3F9F';

function xmlEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function viewInner(t,view,body,k){var b=body||t.body||'step';if(!IMG[b])b='step';var marks=(t.markers||[]);var r=markerR(b,view)*(k||1);var s=artFor(b,view);for(var i=0;i<marks.length;i++)if(marks[i].v===view)s+=markerSVG(marks[i],i,r);return s;}

// --- photos ---
function loadImage(src){return new Promise(function(res,rej){var img=new Image();img.onload=function(){res(img);};img.onerror=function(){rej(new Error('Image failed to load'));};img.src=src;});}
var POOL={};function workCanvas(key,w,h){var c=POOL[key];if(!c){c=document.createElement('canvas');POOL[key]=c;}if(c.width!==w||c.height!==h){c.width=w;c.height=h;}var x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,w,h);return c;}
function releaseCanvases(){Object.keys(POOL).forEach(function(k){POOL[k].width=POOL[k].height=1;});}
function dropImage(img){try{if(img&&img.src&&img.src.slice(0,5)!=='blob:')img.src='';}catch(e){}}
function processImage(file){var url=URL.createObjectURL(file);return loadImage(url).then(function(img){var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;var max=1400,s=Math.min(1,max/Math.max(w,h));var cw=Math.round(w*s),ch=Math.round(h*s);var c=workCanvas('photo',cw,ch);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(img,0,0,cw,ch);var ts=Math.min(1,360/Math.max(cw,ch));var tc=workCanvas('thumb',Math.round(cw*ts),Math.round(ch*ts));tc.getContext('2d').drawImage(c,0,0,tc.width,tc.height);var thumb=tc.toDataURL('image/jpeg',0.7);return new Promise(function(res,rej){c.toBlob(function(b){URL.revokeObjectURL(url);dropImage(img);if(!b||b.size<2000)return rej(new Error('the photo came back empty; try again'));res({blob:b,w:cw,h:ch,thumb:thumb});},'image/jpeg',0.82);});});}
function nextLabel(t){var used=t.photos.map(function(p){return p.label;});for(var i=0;i<SLOTS.length;i++)if(used.indexOf(SLOTS[i])<0)return SLOTS[i];return 'Damage detail';}

function addPhotos(t,files){files=Array.prototype.slice.call(files||[]);if(!files.length)return;var room=MAX_PHOTOS-t.photos.length;if(room<=0){toast('This truck already has '+MAX_PHOTOS+' photos');return;}if(files.length>room){toast('Only '+room+' more photo'+(room===1?'':'s')+' fit on the slide; adding the first '+room);files=files.slice(0,room);}busy('Adding photos\u2026',0);var i=0;

function svgToCanvas(svgStr,w,h,scale){return loadImage('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgStr)).then(function(img){var c=workCanvas('form',Math.round(w*scale),Math.round(h*scale));var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);dropImage(img);return c;});}
function renderFormCanvas(t){return svgToCanvas(formSVG(t,state.meta),1000,1290,1.2);}
function blobToDataURL(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.readAsDataURL(b);});}
function loadPhotosForExport(t){var out=[];var chain=Promise.resolve();t.photos.forEach(function(p){chain=chain.then(function(){return sGet('photo:'+p.id);}).then(function(b){if(!b)return;return blobToDataURL(b).then(function(d){out.push({data:d.replace(/^data:/,''),dataUrl:d,w:p.w,h:p.h,label:p.label});});});});return chain.then(function(){return out;});}
var PX=192; // px per inch on the 1920x1080 slide canvas

function drawSlotPlaceholder(x,box,name,F){x.fillStyle='#F3F4F6';x.fillRect(box.x*PX,box.y*PX,box.w*PX,box.h*PX);x.strokeStyle='#D1D5DB';x.lineWidth=2;x.strokeRect(box.x*PX,box.y*PX,box.w*PX,box.h*PX);x.fillStyle=MUTED;x.font='20px '+F;x.textAlign='center';x.fillText(name,(box.x+box.w/2)*PX,(box.y+box.h/2-0.08)*PX);x.fillText('no photo',(box.x+box.w/2)*PX,(box.y+box.h/2+0.08)*PX);x.textAlign='left';}

function fleetCanvas(trucks,meta,page,pages){var c=workCanvas('slide',1920,1080);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1920,1080);var F='Helvetica, Arial, sans-serif';x.textBaseline='middle';
 x.fillStyle=NAVY;x.font='bold 44px '+F;x.fillText('Fleet list'+(pages>1?' ('+(page+1)+' of '+pages+')':''),0.35*PX,0.405*PX);
 x.fillStyle=MUTED;x.font='22px '+F;x.textAlign='right';x.fillText([meta.location?meta.location+' fleet appearance audit':'Fleet appearance audit',longDate(meta.date)].filter(Boolean).join('   |   '),9.65*PX,0.405*PX);x.textAlign='left';x.fillText(fleetSummary(trucks),0.35*PX,0.745*PX);

function canvasJPEG(c,q){return c.toDataURL('image/jpeg',q||0.85);}

function exportDeck(){saveNow();if(typeof PptxGenJS==='undefined'){toast('PowerPoint library did not load');return;}var T=state.trucks;busy('Building the deck\u2026',0);var pptx=new PptxGenJS();pptx.layout='LAYOUT_16x9';pptx.title='Fleet appearance audit';pptx.author='Fleet audit';addFleetSlides(pptx,T,state.meta);var i=0;
 (function next(){if(i>=T.length){releaseCanvases();busy('Writing the file\u2026',0.98);return pptx.write({outputType:'blob'}).then(function(blob){busy(false);readyModal(blob,fileBase()+'.pptx','PowerPoint deck');}).catch(function(e){busy(false);toast('Deck failed: '+(e.message||e));});}var t=T[i++];busy('Building the deck\u2026 truck '+i+' of '+T.length,i/(T.length+1));renderFormCanvas(t).then(function(fc){var fd=canvasJPEG(fc,0.8);return loadPhotosForExport(t).then(function(ps){addTruckSlide(pptx,t,state.meta,{data:fd.replace(/^data:/,''),w:fc.width,h:fc.height},ps);setTimeout(next,0);});}).catch(function(e){busy(false);toast('Deck failed on truck '+t.truck+': '+(e.message||e));});})();}
function exportPDF(){saveNow();if(!(window.jspdf&&window.jspdf.jsPDF)){toast('PDF library did not load');return;}var T=state.trucks;busy('Building the PDF\u2026',0);var doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'in',format:[10,5.625]});var pages=Math.max(1,Math.ceil(T.length/40));for(var p=0;p<pages;p++){if(p>0)doc.addPage([10,5.625],'landscape');doc.addImage(canvasJPEG(fleetCanvas(T,state.meta,p,pages),0.85),'JPEG',0,0,10,5.625,undefined,'FAST');}var i=0;
 (function next(){if(i>=T.length){releaseCanvases();busy(false);readyModal(doc.output('blob'),fileBase()+'.pdf','PDF');return;}var t=T[i++];busy('Building the PDF\u2026 truck '+i+' of '+T.length,i/T.length);renderFormCanvas(t).then(function(fc){return loadPhotosForExport(t).then(function(ps){var chain=Promise.resolve();ps.forEach(function(p){chain=chain.then(function(){return loadImage(p.dataUrl).then(function(img){p.img=img;});});});return chain.then(function(){doc.addPage([10,5.625],'landscape');doc.addImage(canvasJPEG(slideCanvas(t,fc,ps),0.85),'JPEG',0,0,10,5.625,undefined,'FAST');var P=placePhotos(ps);[['damage close-ups',P.detail],['additional photos',P.extra]].forEach(function(g){if(g[1].length){doc.addPage([10,5.625],'landscape');doc.addImage(canvasJPEG(detailCanvas(t,g[1],g[0]),0.85),'JPEG',0,0,10,5.625,undefined,'FAST');}});ps.forEach(function(p){dropImage(p.img);});setTimeout(next,0);});});}).catch(function(e){busy(false);toast('PDF failed on truck '+t.truck+': '+(e.message||e));});})();}
function exportBackup(){saveNow();busy('Packing backup\u2026',0.3);var copy=JSON.parse(JSON.stringify(state));var chain=Promise.resolve();copy.trucks.forEach(function(t){t.photos.forEach(function(p){chain=chain.then(function(){return sGet('photo:'+p.id);}).then(function(b){if(b)return blobToDataURL(b).then(function(d){p.data=d;});});});});chain.then(function(){busy(false);var blob=new Blob([JSON.stringify(copy)],{type:'application/json'});readyModal(blob,fileBase()+'-backup.json','Backup');}).catch(function(e){busy(false);toast('Backup failed: '+(e.message||e));});}
function importBackup(file){var r=new FileReader();r.onload=function(){try{var data=JSON.parse(r.result);if(!data||!Array.isArray(data.trucks))throw new Error('Not a fleet audit backup');busy('Restoring\u2026',0.2);var chain=Promise.resolve();data.trucks.forEach(function(t){t.photos=(t.photos||[]);t.photos.forEach(function(p){if(p.data){var d=p.data;delete p.data;chain=chain.then(function(){return sSet('photo:'+p.id,dataURLtoBlob(d));});}});});chain.then(function(){data.ui={screen:'fleet',truckId:null,code:'S'};state=data;busy(false);return saveNow();}).then(function(){closeModal();render();toast('Backup restored');});}catch(e){busy(false);toast('Could not restore: '+e.message);}};r.readAsText(file);}
function deliverFile(blob,filename){if(DL){return DL.save({filename:filename,data:blob}).then(function(){toast('Saved');closeModal();}).catch(function(e){var code=e&&e.code;if(code==='declined')return;if(code==='unavailable'||code==='not_granted'||code==='capability_disabled'||code==='capability_removed'){DL=null;return deliverFile(blob,filename);}toast('Could not save: '+((e&&(e.message||e.code))||'unknown error'));});}
 try{var file=new File([blob],filename,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){return navigator.share({files:[file],title:filename}).then(function(){closeModal();}).catch(function(e){if(e&&e.name==='AbortError')return;anchorDownload(blob,filename);});}}catch(e){}
 anchorDownload(blob,filename);return Promise.resolve();}
function anchorDownload(blob,filename){var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},6000);closeModal();toast('Download started');}

// --- fleet list editing, settings ---
function openPaste(){var m=modal('<h2>Paste fleet list</h2><p class="muted small">Truck numbers, one per line (or separated by spaces or commas). A column of routes next to the numbers is ignored. Existing trucks keep their audit data.</p><div class="f"><textarea id="paste-box" placeholder="225474&#10;225577&#10;158790" style="min-height:160px"></textarea></div><div class="btnrow"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="go">Add trucks</button></div>');$('[data-a=close]',m).onclick=closeModal;$('[data-a=go]',m).onclick=function(){var rows=parseFleetList($('#paste-box').value);var added=0;rows.forEach(function(r){if(!r.truck)return;var ex=state.trucks.filter(function(t){return t.truck===r.truck;})[0];if(!ex){state.trucks.push(newTruck(r.truck));added++;}});saveNow();closeModal();renderFleet();toast(added?added+' added':(rows.length?'No new trucks':'No truck numbers found'));};setTimeout(function(){var pb=$('#paste-box');if(pb)pb.focus();},50);}
function openAddTruck(){var m=modal('<h2>Add truck</h2><div class="fields"><div class="f wide"><label for="a-truck">Truck number</label><input id="a-truck" type="text" inputmode="numeric"></div></div><div class="btnrow"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="go">Add</button></div>');$('[data-a=close]',m).onclick=closeModal;$('[data-a=go]',m).onclick=function(){var n=$('#a-truck').value.trim();if(!n){toast('Truck number is required');return;}if(state.trucks.some(function(t){return t.truck===n;})){toast('Truck '+n+' is already on the list');return;}var t=newTruck(n);state.trucks.push(t);saveNow();closeModal();openTruck(t.id);};setTimeout(function(){var at=$('#a-truck');if(at)at.focus();},50);}
function openSettings(){var me=state.meta;var m=modal('<h2>Audit settings</h2><div class="fields"><div class="f wide"><label for="s-loc">Location</label><input id="s-loc" type="text" value="'+esc(me.location)+'" placeholder="Branch or location name"></div><div class="f"><label for="s-date">Audit date</label><input id="s-date" type="date" value="'+esc(me.date)+'"></div><div class="f"><label for="s-body">Default body type</label><select id="s-body">'+Object.keys(BODIES).map(function(k){return '<option value="'+k+'"'+(me.body===k?' selected':'')+'>'+BODIES[k]+'</option>';}).join('')+'</select></div><div class="f"><label for="s-aud">Service partner (default)</label><input id="s-aud" type="text" value="'+esc(me.auditor)+'"></div><div class="f"><label for="s-pp">Production partner (default)</label><input id="s-pp" type="text" value="'+esc(me.production)+'"></div></div><div class="btnrow"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="save">Save settings</button></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="stack"><button class="btn" data-a="restore">Restore from backup file</button><input class="filein" id="in-restore" type="file" accept="application/json,.json"><button class="btn danger" data-a="clear">Clear all data on this device</button><button class="btn" data-a="update">Check for update</button></div><p class="muted small" style="margin-top:12px">Data stays on this phone only. Keep a backup or export the deck before switching devices. Fleet audit v'+APP_VERSION+' \u00B7 '+esc(swStatus())+'</p>');$('[data-a=update]',m).onclick=function(){checkUpdate();};
 $('[data-a=close]',m).onclick=closeModal;$('[data-a=save]',m).onclick=function(){me.location=$('#s-loc').value.trim();me.date=$('#s-date').value||todayISO();me.body=$('#s-body').value;me.auditor=$('#s-aud').value.trim();me.production=$('#s-pp').value.trim();saveNow();closeModal();renderFleet();};
 $('[data-a=restore]',m).onclick=function(){$('#in-restore').click();};$('#in-restore').onchange=function(e){if(e.target.files[0])importBackup(e.target.files[0]);};
 $('[data-a=clear]',m).onclick=function(){confirmBox('Clear everything?','All trucks, marks, notes and photos on this device are deleted. Export first if you need them.','Clear all').then(function(ok){if(!ok)return;idb.clear().catch(function(){});memStore={};state=blankState();saveNow();render();toast('Cleared');});};}

// --- init ---
var swReg=null,swWaiting=null,swReady=false,swUpdating=false;
function isStandalone(){try{return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}catch(e){return false;}}
function swAllowed(){return ('serviceWorker' in navigator)&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))&&!/claude\.ai$/.test(location.hostname);}
function swStatus(){return swReady?'offline copy ready':(swAllowed()?'offline copy not ready yet':'offline copy not available on this link');}
function offerUpdate(w){swWaiting=w;toast('An updated Fleet Audit is ready','Reload',function(){swUpdating=true;if(swWaiting)swWaiting.postMessage({type:'skipWaiting'});},true);}
function setupSW(){if(!swAllowed())return;navigator.serviceWorker.addEventListener('controllerchange',function(){if(swUpdating)location.reload();});navigator.serviceWorker.register('sw.js',{scope:'./'}).then(function(reg){swReg=reg;if(reg.waiting&&navigator.serviceWorker.controller)offerUpdate(reg.waiting);reg.addEventListener('updatefound',function(){var w=reg.installing;if(!w)return;w.addEventListener('statechange',function(){if(w.state==='installed'&&navigator.serviceWorker.controller)offerUpdate(w);});});return navigator.serviceWorker.ready;}).then(function(){swReady=true;}).catch(function(){});}
function checkUpdate(){if(!swAllowed()){toast('This link keeps no offline copy; it updates on next open');return;}if(!swReg){toast('Offline copy is not set up yet; try again in a moment');return;}busy('Checking for an update\u2026',0);swReg.update().then(function(){busy(false);if(swReg.waiting&&navigator.serviceWorker.controller)offerUpdate(swReg.waiting);else if(swReg.installing)toast('Downloading an update\u2026');else toast('Up to date: v'+APP_VERSION);}).catch(function(){busy(false);toast('Could not check for an update (offline?)');});}
function init(){sGet('state').then(function(s){state=(s&&Array.isArray(s.trucks))?s:blankState();if(!state.meta)state.meta={};if(!state.meta.date)state.meta.date=todayISO();if(!state.ui)state.ui={screen:'fleet',truckId:null,code:'S'};var migrated=false;state.trucks.forEach(function(t){t.markers=t.markers||[];t.photos=t.photos||[];if((t.mkv||1)<2){if(t.markers.length)migrateMarkers(t);t.mkv=2;migrated=true;}});if(migrated)saveNow();render();}).catch(function(){state=blankState();render();});
 try{if(window.claude&&typeof window.claude.use==='function'){window.claude.use('downloads').then(function(ns){if(ns)DL=ns;}).catch(function(){});}}catch(e){}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
try{setupSW();}catch(e){}
})();
</script>
